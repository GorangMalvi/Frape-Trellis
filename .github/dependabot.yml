version: 2
updates:
  # Keep the CI/CD actions patched. App deps (frappe-ui is pinned on purpose)
  # are upgraded by hand; Dependabot security alerts still cover them.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
