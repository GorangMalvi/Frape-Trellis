name: Release

# Tag a commit on main as vX.Y.Z (see CONTRIBUTING.md → Releases) to publish a
# GitHub Release with auto-generated notes. Tags are the rollback points for deploy.yml.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main — releases are cut from main only"; exit 1
          fi
      - name: Version matches sprint/__init__.py
        run: |
          app_version="$(python3 -c 'import re,pathlib;print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", pathlib.Path("sprint/__init__.py").read_text()).group(1))')"
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match sprint/__init__.py __version__ ($app_version)"; exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
